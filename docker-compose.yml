services:
  backend-api:
    build:
      context: ./backend-api
    ports:
      - "8080:8080"
    volumes:
      # Everything that must survive `docker compose up --build`. Without
      # this, recreating the container — which is how ANY config change is
      # applied — silently destroys the database and every uploaded file.
      - backend-data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Both point inside the mounted volume above.
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
      Storage__RootPath: /app/data/storage
      # Flashcard generation, via any OpenAI-compatible /chat/completions
      # endpoint. Set OPENAI_API_KEY in the gitignored .env next to this file.
      # Leaving it empty is safe: the generator falls back to its offline
      # heuristic rather than failing.
      #
      # To go back to a local Ollama instead, re-add the ollama service (see
      # git history) and set Ai__BaseUrl=http://ollama:11434/v1 with any
      # non-empty Ai__ApiKey.
      Ai__BaseUrl: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      Ai__ApiKey: "${OPENAI_API_KEY:-}"
      Ai__Model: "${OPENAI_MODEL:-gpt-4o-mini}"
      # Text-to-speech via Google Cloud. Needs an API key with the
      # Text-to-Speech API enabled; empty disables audio export only.
      Tts__Provider: Google
      Tts__Google__ApiKey: "${GOOGLE_TTS_API_KEY:-}"
      Tts__Google__VoiceName: "${GOOGLE_TTS_VOICE:-pl-PL-Standard-F}"
      # App JWT signing. Two DIFFERENT random secrets, set in the gitignored
      # .env next to this file (see .env.example) — never committed here.
      # Student and admin tokens are each validated only with their own key,
      # so leaking the student key cannot mint an admin token. The API refuses
      # to start if either is missing, shorter than 32 bytes, equal to the
      # other, or one of the public dev-only-* keys.
      Jwt__Key: "${JWT_KEY:?set JWT_KEY in .env (openssl rand -base64 48)}"
      Jwt__Issuer: fajneoceny
      Jwt__Audience: fajneoceny-app
      Jwt__ExpiryMinutes: "43200"
      # Admin tokens expire in hours, not days.
      Jwt__AdminKey: "${JWT_ADMIN_KEY:?set JWT_ADMIN_KEY in .env (openssl rand -base64 48)}"
      Jwt__AdminExpiryMinutes: "480"
      # The single super-admin account, created/updated on every startup.
      # Set both in the gitignored .env next to this file (same place as
      # LAN_IP). PasswordHash is a HASH, never a plaintext password:
      #
      #   cd backend-api && dotnet run --no-launch-profile -- hash-password 'your password' | tail -1
      #
      # then in .env:
      #   SUPER_ADMIN_EMAIL=you@example.com
      #   SUPER_ADMIN_PASSWORD_HASH=AQAAAAIAAYag...
      #
      # Leaving them unset logs a warning and creates no admin account, which
      # is fine for a dev stack that doesn't need the admin panel.
      SuperAdmin__Email: "${SUPER_ADMIN_EMAIL:-}"
      SuperAdmin__PasswordHash: "${SUPER_ADMIN_PASSWORD_HASH:-}"
      # Google Sign-In client id(s) allowed as the ID token audience.
      # Production MUST set this (uncomment and fill in the real OAuth client
      # id below). Left unset here so dev/self-host environments without
      # Google Sign-In configured still start — GoogleTokenVerifier skips the
      # audience check when no client ids are configured.
      Google__ClientIds__0: "495592595870-klmp9mk043di5tg9kmpbhpalcn4q6g35.apps.googleusercontent.com"

  # Expo dev server. Web build at http://localhost:8081, and the native bundle
  # that Expo Go connects to over the LAN.
  #
  # LAN_IP must be your host machine's LAN address (e.g. 192.168.1.17) — find
  # it with `ipconfig getifaddr en0` on macOS or `hostname -I` on Linux. Expo
  # advertises this to the phone instead of the unreachable container IP, and
  # frontend/src/api/config.ts reuses it to reach backend-api on :8080.
  # Set it in a .env file next to this compose file: LAN_IP=192.168.1.17
  frontend:
    build:
      context: ./frontend
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:?set LAN_IP to your host LAN address, e.g. LAN_IP=192.168.1.17}
    volumes:
      # Live-reload edits from the host. The anonymous volume keeps the
      # container's own node_modules (installed for linux) from being shadowed
      # by the host's macOS-built one.
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

volumes:
  # Survives `docker compose up --build`. Removed only by an explicit
  # `docker compose down -v`, which is the one command that will wipe it.
  backend-data:

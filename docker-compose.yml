services:
  backend-api:
    build:
      context: ./backend-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Point flashcard generation at the local Ollama server (OpenAI-compatible
      # endpoint). Leave Ai__BaseUrl empty to fall back to the offline heuristic
      # generator instead. qwen2.5:3b is the smallest Qwen that reliably emits
      # the JSON array the generator expects (~2 GB on disk, ~4 GB RAM, CPU-only).
      Ai__BaseUrl: http://ollama:11434/v1
      Ai__ApiKey: ollama          # not checked locally, but the field must be non-empty
      Ai__Model: qwen2.5:3b
      # App JWT signing. Jwt__Key is a dev-only placeholder — production MUST
      # override it with a long random secret kept out of source control.
      Jwt__Key: dev-only-placeholder-signing-key-change-me-32chars-min
      Jwt__Issuer: fajneoceny
      Jwt__Audience: fajneoceny-app
      Jwt__ExpiryMinutes: "43200"
      # Google Sign-In client id(s) allowed as the ID token audience.
      # Production MUST set this (uncomment and fill in the real OAuth client
      # id below). Left unset here so dev/self-host environments without
      # Google Sign-In configured still start — GoogleTokenVerifier skips the
      # audience check when no client ids are configured.
      # Google__ClientIds__0: "your-client-id.apps.googleusercontent.com"
    depends_on:
      model-puller:
        condition: service_completed_successfully

  # Local LLM server exposing an OpenAI-compatible API at :11434.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # persist pulled models across restarts

  # One-shot: pulls the Qwen model into the shared volume, then exits. The
  # backend waits for this to complete so the first quiz request doesn't race
  # the download.
  model-puller:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

  # Expo dev server — web build only, viewable at http://localhost:8081.
  mobile-app:
    build:
      context: ./mobile-app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

volumes:
  ollama-models:
